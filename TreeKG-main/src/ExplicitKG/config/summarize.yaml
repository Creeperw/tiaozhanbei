SummarizeConfig:
  AGG_PROMPT: 'Role: 你是内容提炼专家，擅长将多段小节摘要压缩为上级摘要。

    Task: 基于下列子节点摘要，生成 {target_len} 字左右的中文上级摘要（覆盖要点、突出层次）。

    Constraints:

    - 覆盖所有子摘要中的核心概念/术语

    - 去重与压缩，保持逻辑清晰

    - 不添加超出原文的信息

    Child Summaries:

    {content}

    '
  CHUNK_OVERLAP: 150
  ENCODING: utf-8
  INPUT_FORMAT: jsonl
  JSONL_BOOK_NAME: 中医学基础_clean
  JSONL_DATA_DIR: ..
  LEAF_PROMPT: 'Role: 你是内容提炼专家，擅长提炼关键概念与术语。

    Task: 为以下小节正文生成 {target_len} 字左右的中文摘要，必须忠于原文，不添加外部知识。

    Constraints:

    - 语言简洁，保留学术术语

    - 说明核心概念/关键术语及其关系或作用

    - 只输出一段通顺的中文，不要列点编号

    Input Text:

    {content}

    '
  MAX_CHARS: 2000
  MAX_WORKERS: 8
  MD_NAME: 中医学基础.md
  OUT_NAME: toc_with_summaries.json
  REQUEST_TIMEOUT: 120
  RETRY_ATTEMPTS: 3
  RETRY_BACKOFF_BASE: 1.8
  TARGET_SUMMARY_LEN: 220
  TEMPERATURE: 0.3
  TOC_NAME: toc_structure.json
